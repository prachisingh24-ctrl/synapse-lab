<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign out — Synapse Lab</title><link rel="stylesheet" href="/style.css"></head><body><main class="logout-page"><div class="logout-card panel"><div class="logout-mark">S</div><span class="status">SYNAPSE LAB · ACCOUNT</span><div id="logoutContent"><h1>Checking your session…</h1><p class="muted">One moment.</p></div></div></main><script>const content=document.getElementById('logoutContent');const escapeHtml=s=>String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function init(){try{const session=await window.hatchable.auth.getSession();const user=session?.user||session?.member||session;if(user){const email=user.email||user.handle||'your account';content.innerHTML='<h1>Ready to sign out?</h1><p class="muted">You are signed in as <strong>'+escapeHtml(email)+'</strong>.</p><div class="logout-actions"><button class="btn btn-primary" id="signOut">Sign out</button><a class="btn btn-secondary" href="/">Cancel</a></div>';document.getElementById('signOut').onclick=async()=>{const b=document.getElementById('signOut');b.disabled=true;b.textContent='Signing out…';try{localStorage.removeItem('synapseLabWelcomed');await window.hatchable.auth.signOut();content.innerHTML='<div class="success-icon">✓</div><h1>Thank you for exploring Synapse Lab.</h1><p class="muted">You have been signed out successfully. Your session is closed, but the lab is always ready for your next experiment.</p><div class="logout-actions"><a class="btn btn-primary" href="/login">Return to login</a><a class="btn btn-secondary" href="/">Back to lab</a></div>';}catch(e){b.disabled=false;b.textContent='Sign out';alert('Sign out could not be completed. Please try again.');}};}else{content.innerHTML='<div class="success-icon">✓</div><h1>You’re already signed out.</h1><p class="muted">Thanks for visiting Synapse Lab. Your next experiment is waiting.</p><div class="logout-actions"><a class="btn btn-primary" href="/login">Go to login</a><a class="btn btn-secondary" href="/">Back to lab</a></div>';}}catch(e){content.innerHTML='<h1>Session check unavailable</h1><p class="muted">You can safely return to the lab or login page.</p><div class="logout-actions"><a class="btn btn-primary" href="/login">Login</a><a class="btn btn-secondary" href="/">Back to lab</a></div>';}}init();</script><style>.logout-page{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 20%,#fff8f2,#f4f7fb 55%)}.logout-card{width:min(520px,100%);padding:42px;text-align:center}.logout-mark{width:58px;height:58px;border-radius:17px;background:linear-gradient(135deg,#ff7a18,#ffb347);display:grid;place-items:center;color:#fff;font-size:24px;font-weight:900;margin:0 auto 22px;box-shadow:0 10px 28px rgba(255,122,24,.2)}.logout-card h1{font-size:32px;line-height:1.1;letter-spacing:-.035em;margin:16px 0 10px}.logout-card p{font-size:14px}.logout-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:26px}.logout-actions .btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.success-icon{width:48px;height:48px;border-radius:50%;margin:18px auto 8px;display:grid;place-items:center;background:#e9f8ef;color:#21864b;font-size:25px;font-weight:900}@media(max-width:520px){.logout-card{padding:28px 20px}.logout-card h1{font-size:27px}.logout-actions .btn{width:100%}}</style></body></html>
