<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Synapse Lab · Admin Catalog</title><link rel="stylesheet" href="/style.css"></head><body><header><div class="brand"><div><b>SYNAPSE LAB / ADMIN</b><small>RESEARCH CATALOG</small></div></div><nav><a href="/">← Lab</a></nav></header><main class="admin-main"><div class="section-head"><div><span class="status">OWNER CONSOLE</span><h2>User experiment catalog.</h2></div><button class="btn btn-primary" onclick="load()">↻ Refresh</button></div><div id="adminState" class="result">Loading protected catalog…</div><div id="tableWrap" class="admin-table"></div></main><script>async function load(){const r=await fetch('/api/admin-users');const d=await r.json();if(!r.ok){document.getElementById('adminState').innerHTML='<b>ADMIN ACCESS REQUIRED</b><p>Sign in with the Hatchable project owner account to view the catalog.</p>';return}document.getElementById('adminState').innerHTML='<b>'+d.users.length+' USER PROFILES WITH EXPERIMENT DATA</b><p>Only aggregate app activity is shown here. Experiment records are stored per signed-in user.</p>';document.getElementById('tableWrap').innerHTML='<table><thead><tr><th>User</th><th>Experiments</th><th>Last active</th><th>Avg strength</th><th>Successful recalls</th></tr></thead><tbody>'+d.users.map(u=>'<tr><td><b>'+escapeHtml(u.email||'Unknown')+'</b><small>'+u.user_id.slice(0,12)+'…</small></td><td>'+u.experiments+'</td><td>'+new Date(u.last_active).toLocaleString()+'</td><td>'+u.avg_strength+'%</td><td>'+u.successful_recalls+'</td></tr>').join('')+'</tbody></table>'}function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}load();</script></body></html>
